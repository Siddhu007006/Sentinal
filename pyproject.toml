[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ===========================================================================
# Project Metadata (PEP 621)
# ===========================================================================

[project]
name = "sentinel-backend"
version = "0.1.0"
description = "Sentinel — Digital Asset Analysis Platform backend service"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [
    { name = "Sentinel Engineering Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

# ===========================================================================
# Runtime Dependencies
#
# Each dependency traces to a specific architectural decision:
#
#   FastAPI + uvicorn     → 03-Architecture §4 (Presentation layer)
#   SQLAlchemy + asyncpg  → 03-Architecture §4, 04-Database-Design
#   Alembic               → 04-Database-Design, 06-Repository-Structure §3
#   Celery + Redis        → 03-Architecture §4, 00-Project-Context §5
#   Pydantic              → 03-Architecture §4, 07-Backend-Standards §3
#   pydantic-settings     → 07-Backend-Standards §11, 06-Repository-Structure
#   python-jose           → 08-Security-Architecture §4 (JWT)
#   passlib               → 08-Security-Architecture §4 (password hashing)
#   python-multipart      → 05-API-Specification (file uploads)
#   httpx                 → 03-Architecture §4 (external API adapters)
#   boto3                 → 03-Architecture §4, 06-Repository-Structure §7
# ===========================================================================

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "psycopg2-binary>=2.9,<3.0.0",  # Required by Alembic migrations (sync driver)
    "alembic>=1.14.0,<2.0.0",
    "celery[redis]>=5.4.0,<6.0.0",
    "redis>=5.2.0,<6.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "boto3>=1.35.0,<2.0.0",
]

# ===========================================================================
# Development Dependencies
#
#   pytest + pytest-asyncio + pytest-cov → 11-Testing-Strategy
#   ruff                                 → 07-Backend-Standards §3 (linting)
#   mypy                                 → 07-Backend-Standards §3 (typing)
#   pre-commit                           → 07-Backend-Standards §3 (CI gates)
#   factory-boy                          → 11-Testing-Strategy §6 (fixtures)
# ===========================================================================

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "factory-boy>=3.3.0,<4.0.0",
]

[dependency-groups]
dev = []


# ===========================================================================
# Ruff — Linting + Formatting + Import Sorting
#
# Replaces Black (formatter) + isort (import sorting) + flake8 (linter)
# in a single tool. Per 07-Backend-Development-Standards §3:
#   - "Ruff or equivalent" for linting
#   - "Black" for formatting (Ruff's formatter is Black-compatible)
#   - Imports grouped: stdlib → third-party → first-party (§3 line 118)
#   - Wildcard imports prohibited (§3 line 120)
#   - Linter warnings treated as build failures (§3 line 114)
# ===========================================================================

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes — unused imports, undefined names
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort — import sorting (stdlib → third-party → first-party)
    "N",      # pep8-naming — class, function, variable naming conventions
    "UP",     # pyupgrade — modern Python syntax (3.12+)
    "B",      # flake8-bugbear — common correctness issues
    "A",      # flake8-builtins — shadowing built-in names
    "C4",     # flake8-comprehensions — unnecessary list/dict/set calls
    "DTZ",    # flake8-datetimez — naive datetime prevention (Doc 07 §3)
    "T20",    # flake8-print — no print() in production code
    "SIM",    # flake8-simplify — simplifiable constructs
    "TCH",    # flake8-type-checking — imports only needed for type checking
    "RUF",    # Ruff-specific rules
    "PT",     # flake8-pytest-style — pytest best practices
    "S",      # flake8-bandit — security issues
    "ANN",    # flake8-annotations — enforce type annotations (Doc 07 §3)
]
ignore = [
    "S101",    # allow assert in tests (pytest requires it)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the test mechanism
    "S105",    # hardcoded secrets in test env vars
    "S106",    # hardcoded password fixture (tests use fixed test values)
    "S603",    # subprocess call in tests
    "ANN",     # test functions don't need full annotation
    "T20",     # print can be useful in test debugging
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ===========================================================================
# mypy — Static Type Checking
#
# Per 07-Backend-Development-Standards §3:
#   - "Every function signature must be fully type-annotated"
#   - "Static type checking runs in CI and is a merge blocker"
#   - "Any is permitted only at genuine integration boundaries"
# ===========================================================================

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
show_column_numbers = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "passlib.*",
    "jose.*",
    "boto3.*",
    "botocore.*",
    "factory.*",
    "pytest_asyncio",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# ===========================================================================
# pytest — Test Runner
#
# Per 11-Testing-Strategy:
#   - Test pyramid: most unit, fewer integration, fewest E2E
#   - "Confidence over coverage percentage" — coverage is a floor, not target
#   - Fixtures through factory-boy (§6)
#   - asyncio mode for FastAPI/SQLAlchemy async tests
# ===========================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests — no I/O, no external dependencies",
    "integration: Integration tests — real database, real services",
    "api: API-level tests — HTTP request/response validation",
    "slow: Tests that take >1s to execute",
    "asyncio: Async test using pytest-asyncio",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:asyncio.*",
    "ignore::DeprecationWarning:pytest_asyncio.*",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.pytest-asyncio]
mode = "auto"

# ===========================================================================
# Coverage — Floor and Regression Signal
#
# Per 11-Testing-Strategy §2:
#   - Coverage "treated as a floor and a regression signal, not a target"
#   - "A meaningful drop on touched code blocks merge"
# ===========================================================================

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/infrastructure/config/*",
    "app/main.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
    "raise NotImplementedError",
]
