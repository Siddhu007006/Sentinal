name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Mirrors docker-compose role provisioning defaults
  SCHEMA_OWNER_PASSWORD: schema_owner_password
  SENTINEL_API_PASSWORD: sentinel_api_password
  CI_DATABASE: sentinel_ci
  # Pinned object-store images (same versions as docker-compose.yml)
  MINIO_IMAGE: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
  MC_IMAGE: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check backend/app

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Type check with mypy
        run: uv run mypy backend/app --strict

  test:
    name: Tests (two-role DB)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinel_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      # ---- Object storage (pinned; mirrors docker-compose) ----
      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            ${{ env.MINIO_IMAGE }} \
            server /data

      - name: Wait for MinIO and create bucket
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:9000/minio/health/live && break
            sleep 2
          done
          docker run --rm --network host \
            -e MC_HOST_minio=http://minioadmin:minioadmin@localhost:9000 \
            ${{ env.MC_IMAGE }} \
            mb --ignore-existing minio/sentinel-assets

      # ---- Two-role DB privilege model (mirrors docker/bootstrap) ----
      - name: Provision schema_owner and sentinel_api roles
        run: |
          sed \
            -e "s|POSTGRESQL_SCHEMA_OWNER_PASSWORD|${SCHEMA_OWNER_PASSWORD}|g" \
            -e "s|POSTGRESQL_SENTINEL_API_PASSWORD|${SENTINEL_API_PASSWORD}|g" \
            docker/bootstrap/create_roles.sql \
          | docker run --rm -i --network host \
              -e PGPASSWORD=postgres \
              postgres:16-alpine \
              psql -h localhost -p 5432 -U postgres -d "$CI_DATABASE"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Settings load .env from the repo root (pytest runs from root;
      # pythonpath=backend per pyproject).
      - name: Write test environment (.env)
        run: |
          cp .env.example .env
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql+asyncpg://sentinel_api:'"$SENTINEL_API_PASSWORD"'@localhost:5432/'"$CI_DATABASE"'|' .env
          sed -i 's|^DATABASE_MIGRATION_URL=.*|DATABASE_MIGRATION_URL=postgresql://schema_owner:'"$SCHEMA_OWNER_PASSWORD"'@localhost:5432/'"$CI_DATABASE"'|' .env
          sed -i 's|^REDIS_URL=.*|REDIS_URL=redis://localhost:6379/0|' .env
          sed -i 's|^S3_ENDPOINT_URL=.*|S3_ENDPOINT_URL=http://localhost:9000|' .env
          sed -i 's|^S3_ACCESS_KEY=.*|S3_ACCESS_KEY=minioadmin|' .env
          sed -i 's|^S3_SECRET_KEY=.*|S3_SECRET_KEY=minioadmin|' .env
          grep -E '^(DATABASE_URL|DATABASE_MIGRATION_URL)=' .env

      - name: Run migrations as schema_owner
        working-directory: backend
        env:
          DATABASE_MIGRATION_URL: postgresql://schema_owner:schema_owner_password@localhost:5432/sentinel_ci
        run: uv run python -m alembic upgrade head

      - name: Enforce audit_logs immutability (post-migration fix)
        run: |
          docker run --rm -i --network host \
            -e PGPASSWORD=postgres \
            postgres:16-alpine \
            psql -h localhost -p 5432 -U postgres -d "$CI_DATABASE" \
            < docker/bootstrap/fix_audit_logs_post_migration.sql

      - name: Unit tests
        run: uv run pytest backend/tests/unit -q

      - name: Integration tests (as sentinel_api)
        env:
          DATABASE_MIGRATION_URL: postgresql://schema_owner:schema_owner_password@localhost:5432/sentinel_ci
        run: uv run pytest backend/tests/integration -q

      - name: Verify migrations are reversible
        if: always()
        working-directory: backend
        env:
          DATABASE_MIGRATION_URL: postgresql://schema_owner:schema_owner_password@localhost:5432/sentinel_ci
        run: uv run python -m alembic downgrade base

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ${{ env.UV_CACHE_DIR }}
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Verify app factory
        run: uv run python -c "from app.main import create_app; create_app(); print('app factory OK')"
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://sentinel_api:${{ env.SENTINEL_API_PASSWORD }}@localhost:5432/${{ env.CI_DATABASE }}
          DATABASE_MIGRATION_URL: postgresql://schema_owner:${{ env.SCHEMA_OWNER_PASSWORD }}@localhost:5432/${{ env.CI_DATABASE }}
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET_NAME: sentinel-assets
          JWT_SECRET_KEY: test-secret-key-for-ci-only-at-least-32-chars
          CORS_ORIGINS: http://localhost:3000
          ENVIRONMENT: test

      - name: Compile all modules
        run: uv run python -m compileall backend/app -q && echo "compileall OK"

      - name: Check dependency consistency
        run: uv pip check

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build-verification]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint failed"; exit 1
          fi
          if [[ "${{ needs.type-check.result }}" != "success" ]]; then
            echo "Type check failed"; exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Tests failed"; exit 1
          fi
          if [[ "${{ needs.build-verification.result }}" != "success" ]]; then
            echo "Build verification failed"; exit 1
          fi
          echo "All checks passed"
