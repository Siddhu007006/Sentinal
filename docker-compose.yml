# ===========================================================================
# Sentinel — Docker Compose for Local Development
# ===========================================================================
#
# Purpose: Provide local development environment with PostgreSQL, Redis, and
#          MinIO matching 09-Deployment-Architecture Â§2 (Environment Parity)
#
# Usage:
#   docker compose up -d
#   docker compose ps              # verify all healthy
#   docker compose down
#   docker compose down -v         # remove volumes
#
# Reference: 09-Deployment-Architecture Â§5 (Container Architecture),
#            06-Repository-Structure Â§12 (docker-compose.yml)
#
# ===========================================================================

services:
  # =========================================================================
  # PostgreSQL 16 — System of Record
  # =========================================================================
  # Per 09-Deployment-Architecture Â§8: "PostgreSQL is the durable system
  # of record for all structured metadata... its underlying storage volume
  # is persistent and independent of any single API or Worker container's
  # lifecycle."
  #
  # Per 04-Database-Design: PostgreSQL 16 with asyncpg driver.
  # Per 07-Backend-Development-Standards: async SQLAlchemy connection.
  # =========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      # Bootstrap user (superuser) — used ONLY for initial setup and postgres-init service
      # Per 04-Database-Design Â§11.1: Privilege Separation
      # Application runtime connects as sentinel_api role (via DATABASE_URL)
      # Migrations connect as schema_owner role (via DATABASE_MIGRATION_URL)
      # Two-role architecture enforces database-level audit immutability.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinel
      # Reduce logging verbosity in development
      POSTGRES_INITDB_ARGS: "-c log_statement=none"
    ports:
      - "5432:5432"
    volumes:
      # Persistent volume for database files
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # =========================================================================
  # PostgreSQL Role Bootstrap (Initialization)
  # =========================================================================
  # Per 04-Database-Design Â§11.1: Two-role architecture requires role
  # provisioning outside Alembic to avoid circular dependency.
  #
  # This init container runs create_roles.sql AFTER postgres is healthy
  # and BEFORE migrations run, ensuring schema_owner and sentinel_api roles
  # exist before Alembic attempts DDL operations.
  #
  # Reference: Phase 2 (Bootstrap SQL Script), Phase 3 (Docker Integration)
  # =========================================================================

  postgres-init:
    image: postgres:16-alpine
    container_name: sentinel-postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sentinel
      POSTGRESQL_SCHEMA_OWNER_PASSWORD: ${POSTGRESQL_SCHEMA_OWNER_PASSWORD:-schema_owner_password}
      POSTGRESQL_SENTINEL_API_PASSWORD: ${POSTGRESQL_SENTINEL_API_PASSWORD:-sentinel_api_password}
    volumes:
      # Mount bootstrap script from repository
      - ./docker/bootstrap/create_roles.sql:/tmp/create_roles.sql:ro
    entrypoint: /bin/sh
    command: 
      - -c
      - |
        set -e
        echo "Waiting for PostgreSQL to be ready..."
        until pg_isready -h postgres -U postgres; do
          sleep 1
        done
        echo "PostgreSQL ready. Running role provisioning..."

        # Create temporary file with substituted bootstrap script
        mkdir -p /tmp/bootstrap
        sed \
          -e "s|POSTGRESQL_SCHEMA_OWNER_PASSWORD|$POSTGRESQL_SCHEMA_OWNER_PASSWORD|g" \
          -e "s|POSTGRESQL_SENTINEL_API_PASSWORD|$POSTGRESQL_SENTINEL_API_PASSWORD|g" \
          /tmp/create_roles.sql > /tmp/bootstrap/create_roles_substituted.sql

        # Execute bootstrap script
        # set -e ensures the script exits on first SQL error
        # (psql will output error details before exiting with status != 0)
        echo "Executing role provisioning script..."
        if psql -h postgres -U postgres -d sentinel -f /tmp/bootstrap/create_roles_substituted.sql; then
          echo "Role provisioning completed successfully"
          exit 0
        else
          echo "ERROR: Role provisioning failed (see output above for details)"
          exit 1
        fi
    restart: "no"
  # =========================================================================
  # PostgreSQL Post-Migration Permission Fix
  # =========================================================================
  # Per ROLE_PROVISIONING_IMPLEMENTATION.md Phase 4: After Alembic creates
  # audit_logs, this service applies permission restrictions (SELECT+INSERT
  # only for sentinel_api) to enforce immutability per 04-Database-Design §11.1.
  #
  # This service:
  #   - Waits for postgres-init to complete (role provisioning)
  #   - Waits for Alembic migrations to complete (alembic_version table exists)
  #   - Executes fix_audit_logs_post_migration.sql
  #   - Verifies the permissions are correctly applied
  #
  # Integration: Application should depend on this service completing
  # before starting (ensures audit_logs is secured before app runtime).
  # =========================================================================

  postgres-init-post-migration:
    image: postgres:16-alpine
    container_name: sentinel-postgres-init-post-migration
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sentinel
    volumes:
      # Mount post-migration fix script
      - ./docker/bootstrap/fix_audit_logs_post_migration.sql:/tmp/fix_audit_logs_post_migration.sql:ro
      # Mount entrypoint script
      - ./docker/bootstrap/apply_audit_logs_fix.sh:/docker-entrypoint.sh:ro
    entrypoint: /bin/sh
    command:
      - /docker-entrypoint.sh
    restart: "no"


  # =========================================================================
  # Redis 7 — Queue Broker
  # =========================================================================
  # Per 09-Deployment-Architecture Â§3: "Redis / Queue — the durable
  # hand-off mechanism between the API (producer) and Workers (consumer)."
  #
  # Per 00-Project-Context: asynchronous pipeline with Celery + Redis.
  # =========================================================================

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      # Persistent volume for queue data
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # =========================================================================
  # MinIO — S3-Compatible Object Storage
  # =========================================================================
  # Per 09-Deployment-Architecture Â§8: "Raw binary content (uploaded files)
  # persists in S3-compatible Object Storage... In Development, this may be
  # an emulated local container."
  #
  # Per 00-Project-Context Â§6: files are never stored in PostgreSQL;
  # S3-compatible store required.
  # =========================================================================

  minio:
    # Pinned for reproducible engineering (the :latest tag previously
    # broke the mc-based bucket init when upstream behavior changed).
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: sentinel-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # API port (used by S3 clients)
      - "9000:9000"
      # Console port (web UI)
      - "9001:9001"
    volumes:
      # Persistent volume for object storage
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # =========================================================================
  # MinIO Client — Auto-create Default Bucket
  # =========================================================================
  # Per 09-Deployment-Architecture Â§5: Services should be initialized
  # with required configuration (health checks, startup validation).
  #
  # This init container creates the default bucket (sentinel-assets)
  # on MinIO startup, matching .env.example S3_BUCKET_NAME.
  # =========================================================================

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: sentinel-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing minio/sentinel-assets;
      exit 0;
      "
    restart: "no"

  # =========================================================================
  # Analysis Worker — Background Job Processing
  # =========================================================================
  # Per 09-Deployment-Architecture §5: Worker runs as a separate process
  # from the API for asynchronous analysis pipeline.
  #
  # Per 22-Engineering-Backlog E6.T5: Worker processes analysis jobs from
  # the queue, executes analyzers, and persists results.
  # =========================================================================

  analysis-worker:
    build:
      context: ./backend
      dockerfile: docker/backend.Dockerfile
    container_name: sentinel-analysis-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    environment:
      # Database configuration
      DATABASE_URL: postgresql+asyncpg://sentinel_api:${POSTGRESQL_SENTINEL_API_PASSWORD:-sentinel_api_password}@postgres:5432/sentinel
      DATABASE_MIGRATION_URL: postgresql+asyncpg://schema_owner:${POSTGRESQL_SCHEMA_OWNER_PASSWORD:-schema_owner_password}@postgres:5432/sentinel

      # Redis configuration
      REDIS_URL: redis://redis:6379/0

      # S3/MinIO configuration
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: sentinel-assets

      # Application configuration
      ENVIRONMENT: development
      LOG_LEVEL: INFO

      # JWT configuration (required by settings, not used by worker)
      JWT_SECRET_KEY: development_secret_key_change_in_production
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7

      # CORS configuration (required by settings, not used by worker)
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000

      # Worker-specific configuration
      WORKER_ANALYSIS_TIMEOUT_SECONDS: 300
      WORKER_MAX_RETRIES: 3
    command: >
      python -m app.workers.analysis_worker.__main__
    restart: unless-stopped
    # Worker can be scaled for higher throughput
    deploy:
      replicas: 1


volumes:
  # Persistent volume for PostgreSQL data
  postgres_data:
    driver: local

  # Persistent volume for Redis data (AOF)
  redis_data:
    driver: local

  # Persistent volume for MinIO object storage
  minio_data:
    driver: local

# ===========================================================================
# Notes
# ===========================================================================
#
# Environment Variables:
#   Services are configured with development defaults matching .env.example.
#   To override: copy .env.example to .env and adjust values before
#   docker compose up, or pass via docker compose environment flags.
#
# Health Checks:
#   All services include health checks per 09-Deployment-Architecture Â§10.
#   Use `docker compose ps` to verify all services show (healthy).
#
# Networking:
#   Services communicate via the internal Docker network created by
#   docker compose; service names (postgres, redis, minio) resolve
#   automatically.
#
# Volume Persistence:
#   Volumes are named and persist across container restarts.
#   Use `docker compose down -v` to remove volumes and reset state.
#
# ===========================================================================

