# Pre-commit hooks for Sentinel repository root
#
# Enforces code quality gates locally before code reaches CI.
# Per 07-Backend-Development-Standards §12:
#   - "Formatting is enforced in CI; a pull request with unformatted code
#     fails the build, not the reviewer's patience."
#   - "Linter warnings are treated as build failures, not suggestions."
#
# These hooks catch violations at commit time, which is faster and
# cheaper than waiting for CI feedback.
#
# Hook versions are pinned to match backend/pyproject.toml configurations:
#   - ruff: v0.8.0 (from pyproject.toml)
#   - mypy: v1.13.0 (from pyproject.toml)
#   - pre-commit-hooks: v5.0.0 (standard library)

repos:
  # Ruff — linting + formatting + import sorting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        name: ruff-lint
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        types_or: [python, pyi]

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  # mypy — static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy-type-check
        pass_filenames: false
        args: [--config-file=backend/pyproject.toml, backend]
        additional_dependencies:
          - pydantic>=2.10.0
          - pydantic-settings>=2.6.0
          - fastapi>=0.115.0
